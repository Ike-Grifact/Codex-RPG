name: Codex RPG - teste real do criador
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototipo-ficha/**'
      - '.github/workflows/criador-e2e.yml'
      - '.github/tests/criador-e2e.cjs'
      - '.github/tests/armadura-de-e2e.cjs'
      - '.github/tests/genetico-navegacao-e2e.cjs'
      - '.github/tests/pequena-ficha-e2e.cjs'
      - '.github/tests/fichas-multiplas-e2e.cjs'
      - '.github/tests/genetico-linhagens-iniciais-e2e.cjs'
      - '.github/tests/custos-raciais-marcadores-e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Baixar codigo da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar Elevar dado por Grau e contornos de XP apenas na edição
        run: node --test prototipo-ficha/grade-step-courage.test.mjs
      - name: Validar Runa-Espinhos, Escudo Rúnico, Ácido e Ar
        run: node --test prototipo-ficha/runa-escudo-acido-ar.test.mjs
      - name: Validar esclarecimentos elementais no SRD v0.85
        run: node --test prototipo-ficha/elemental-confirmation-v085.test.mjs
      - name: Validar Arma Certa e correção de Manejo Perfeito no SRD v0.86
        run: node --test prototipo-ficha/arma-certa-v086.test.mjs
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Servir o site como usuario final
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/codex-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/prototipo-ficha/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/codex-http.log
          exit 1
      - name: Validar transformação Druídica e Elemental (Playtest Nível 1) e Domar como ramo independente
        run: node --test prototipo-ficha/transformacoes-playtest.test.mjs prototipo-ficha/companion-small.test.mjs prototipo-ficha/domar-chain.test.mjs prototipo-ficha/creation-xp.test.mjs prototipo-ficha/element-focus-independence.test.mjs
      # Os módulos druid-life/druid-action da v0.82 permanecem no Git apenas
      # como LEGADO HISTÓRICO e não são mais testes normativos do SRD v1.0.
      - name: Validar os SVGs e os pictogramas do Codex Genético
        run: node --test prototipo-ficha/iconography.test.mjs
      - name: Validar apresentação Druídica e ícones nos equipamentos
        run: node --test prototipo-ficha/druid-icons-ui.test.mjs
      - name: Validar loja compacta e rolagem rápida de equipamentos
        run: node --test prototipo-ficha/equipment-shop-ui.test.mjs
      - name: Validar quatro linhagens e custos raciais
        run: node --test prototipo-ficha/racas.test.mjs prototipo-ficha/catalog-prices.test.mjs prototipo-ficha/armor-defense.test.mjs
      - name: Testar ficha opcional de criatura Pequena no navegador móvel
        run: node .github/tests/pequena-ficha-e2e.cjs
      - name: Validar requisitos da Invocação Elemental e os portes de Domar
        run: node --test prototipo-ficha/elemental-summoning.test.mjs
      - name: Testar múltiplas fichas de jogadores e migração
        run: node .github/tests/fichas-multiplas-e2e.cjs
      - name: Testar graus raciais gratuitos e Codex Genético principal
        run: node .github/tests/genetico-linhagens-iniciais-e2e.cjs
      - name: Validar contornos e ícones de XP racial no mapa e listas
        run: node .github/tests/custos-raciais-marcadores-e2e.cjs
      - name: Testar armaduras na ficha e DE geral no navegador móvel
        run: node .github/tests/armadura-de-e2e.cjs
      - name: Testar fluxo de criacao em Chromium
        run: node .github/tests/criador-e2e.cjs
      - name: Testar gestos de navegacao no grafo no PC e celular
        run: node .github/tests/genetico-navegacao-e2e.cjs
