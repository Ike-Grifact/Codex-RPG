name: Codex RPG - teste real do criador
on:
  pull_request:
    branches: [main]
    paths:
      - 'prototipo-ficha/**'
      - 'criar-conflito/**'
      - 'foundry-prototype/**'
      - '.github/tests/conflito-e2e.cjs'
      - '.github/tests/conflito-rolagens-e2e.cjs'
      - '.github/tests/humanoide-rapido-e2e.cjs'
      - '.github/tests/armadura-npc-e2e.cjs'
      - '.github/workflows/criador-e2e.yml'
      - '.github/tests/criador-e2e.cjs'
      - '.github/tests/genetico-navegacao-e2e.cjs'
      - '.github/tests/genetico-rotulos-e2e.cjs'
      - '.github/tests/genetico-reembolso-e2e.cjs'
      - '.github/tests/recuperacao-vigorosa-e2e.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creator-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Baixar codigo da branch
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador de teste
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Servir o site como usuario final
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/codex-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/prototipo-ficha/ -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/codex-http.log
          exit 1
      - name: Testar regras do Foundry e do conflito no Node
        run: node --test foundry-prototype/tests/rules.test.mjs criar-conflito/rules.test.mjs criar-conflito/roll-engine.test.mjs
      - name: Testar conflito e sobrecarga de VT em Chromium
        run: node .github/tests/conflito-e2e.cjs
      - name: Testar rolagens de criaturas e consumo de Pavor
        run: node .github/tests/conflito-rolagens-e2e.cjs
      - name: Testar fluxo de criacao em Chromium
        run: node .github/tests/criador-e2e.cjs
      - name: Testar humanoide rápido com DNA, compra roxa e envio ao conflito
        run: node .github/tests/humanoide-rapido-e2e.cjs
      - name: Testar Integridade da armadura e atalho visual de NPC
        run: node .github/tests/armadura-npc-e2e.cjs
      - name: Testar gestos de navegacao no grafo no PC e celular
        run: node .github/tests/genetico-navegacao-e2e.cjs
      - name: Verificar rótulos inteiros no Codex Genético em desktop e celular
        run: node .github/tests/genetico-rotulos-e2e.cjs
      - name: Testar reversão de Perícias e reembolso no DNA em modo edição
        run: node .github/tests/genetico-reembolso-e2e.cjs
      - name: Testar Recuperação Vigorosa por 1 XP, requisitos e reembolso
        run: node .github/tests/recuperacao-vigorosa-e2e.cjs
